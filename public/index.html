<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FIFA Predict Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1512; --bg2:#111d17; --card:#132019; --card2:#16261d;
  --line:#1f3327; --line2:#2a4436;
  --text:#eaf3ec; --muted:#8ea99a; --muted2:#5f7c6c;
  --green:#2fbf71; --green2:#22a862; --green-glow:rgba(47,191,113,.35);
  --amber:#e0a94a; --red:#e0554a; --blue:#4a9fe0;
  --radius:14px; --radius-sm:9px;
  --font-head:'Barlow Condensed',sans-serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:radial-gradient(600px 300px at 15% -5%, rgba(47,191,113,.10), transparent 60%),radial-gradient(500px 260px at 100% 0%, rgba(74,159,224,.06), transparent 60%),var(--bg);overflow-x:hidden;}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;letter-spacing:.2px;margin:0;}
p{margin:0;color:var(--muted);line-height:1.5;}
button{font-family:var(--font-body);cursor:pointer;}
a{color:var(--green);text-decoration:none;}
input,select{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--card2);color:var(--text);font-size:16px;font-family:var(--font-body);}
input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px;}
.field{margin-bottom:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:12px;border:none;font-size:16px;font-weight:600;min-height:50px;transition:transform .08s ease, filter .15s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(180deg,var(--green),var(--green2));color:#06150d;box-shadow:0 6px 18px var(--green-glow);}
.btn-outline{background:transparent;border:1px solid var(--line2);color:var(--text);}
.btn-ghost{background:transparent;color:var(--muted);border:none;padding:10px;}
.btn-danger{background:rgba(224,85,74,.15);color:var(--red);border:1px solid rgba(224,85,74,.4);}
.btn-sm{padding:9px 12px;font-size:13px;min-height:38px;width:auto;border-radius:9px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center;}
.muted{color:var(--muted);font-size:14px;}
.small{font-size:12.5px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.pill-active{background:rgba(47,191,113,.15);color:var(--green);}
.pill-expired{background:rgba(224,85,74,.15);color:var(--red);}
.pill-disabled{background:rgba(140,150,145,.15);color:var(--muted2);}
.divider{height:1px;background:var(--line);margin:16px 0;border:none;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;gap:10px;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:999;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast.err{border-color:rgba(224,85,74,.5);color:#ffd9d5;}
.toast.ok{border-color:rgba(47,191,113,.5);}
.logo-badge{width:74px;height:74px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%, #1c3527, #0e1a13);border:1px solid var(--line2);font-size:36px;box-shadow:0 0 0 6px rgba(47,191,113,.06), 0 10px 24px rgba(0,0,0,.4);margin-bottom:16px;}
.brand-title{font-size:34px;letter-spacing:.3px;}
.brand-sub{margin-top:6px;color:var(--muted);font-size:14.5px;max-width:320px;}
.telegram-box{margin-top:26px;padding:14px;border-radius:12px;background:var(--card2);border:1px dashed var(--line2);text-align:center;}
.header-app{position:sticky;top:0;z-index:20;background:rgba(13,21,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px var(--green-glow);}
.tabbar{display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:16px 0;}
.tabbar button{flex:1;padding:10px 8px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;}
.tabbar button.active{background:var(--green);color:#06150d;}
.team-select{background:var(--card2);border:1px solid var(--line2);border-radius:var(--radius);padding:14px;}
.stat-line{display:flex;gap:14px;margin-top:8px;}
.stat-chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center;}
.stat-chip .num{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--green);}
.stat-chip .lbl{font-size:11px;color:var(--muted);}
.vs-badge{display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:15px;color:var(--muted2);margin:6px 0;}
.result-hero{text-align:center;padding:22px 16px;border-radius:var(--radius);background:linear-gradient(180deg,rgba(47,191,113,.12),rgba(47,191,113,.02));border:1px solid var(--line2);}
.result-hero .big{font-family:var(--font-head);font-size:30px;font-weight:800;color:var(--green);}
.probbar{height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--card2);margin-top:10px;}
.probbar span{height:100%;}
.hist-item{padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);}
.tap-zone{width:100%;height:36px;}
.modal-overlay{position:fixed;inset:0;background:rgba(3,8,6,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
.modal-sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 18px 30px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
@media (min-width:640px){.modal-overlay{align-items:center;}.modal-sheet{border-radius:20px;}}
table.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
table.admin-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.admin-table td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;}
.table-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat-box .n{font-family:var(--font-head);font-size:26px;font-weight:700;}
.stat-box .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.chip-filter{display:inline-flex;padding:7px 13px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted);background:transparent;margin-right:6px;margin-bottom:8px;}
.chip-filter.active{background:var(--green);color:#06150d;border-color:var(--green);}
.copy-code{font-family:var(--font-head);font-size:22px;letter-spacing:2px;color:var(--green);background:var(--card2);border:1px dashed var(--line2);padding:12px;border-radius:10px;text-align:center;}
.loader{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--green);animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}
</style>
</head>

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, type){
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);

function daysToMs(n){ return n*24*60*60*1000; }
function saveLocal(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function loadLocal(k){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }

async function api(path, method, body, token){
  const res = await fetch("/api/" + path, {
    method: method || "GET",
    headers: Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err = new Error(data.error || "erreur"); err.code = data.error; err.status = res.status; throw err; }
  return data;
}

async function init(){
  try{
    const s = await api("public-settings", "GET");
    if(s.telegramContact) telegramContact = s.telegramContact;
    if(s.telegramBotUsername) telegramBotUsername = s.telegramBotUsername;
  }catch(e){}

  const savedSession = loadLocal("fpp_session");
  if(savedSession && savedSession.expiresAt > Date.now()){
    session = savedSession;
    state.screen = "app";
  } else {
    session = null;
    state.screen = "home";
  }
  render();
}

function findTeam(val){
  if(!val) return null;
  const [country,league,name] = val.split("|");
  const block = TEAM_DATA.find(b=>b.country===country && b.league===league);
  if(!block) return null;
  const t = block.teams.find(x=>x[0]===name);
  return t ? {country,league,name:t[0],att:t[1],def:t[2]} : null;
}

  const el = document.getElementById("tabcontent");
  const opts = window.__opts;
  el.innerHTML = `
  <div class="stack">

      <select id="sel_home" onchange="onTeamChange()"><option value="">— Choisir une équipe —</option>${opts}</select>

  if(state.homeSel) document.getElementById("sel_home").value = state.homeSel;

function onTeamChange(){
  state.homeSel = document.getElementById("sel_home").value;
  state.awaySel = document.getElementById("sel_away").value;
  const h = findTeam(state.homeSel), a = findTeam(state.awaySel);
  document.getElementById("home_stats").innerHTML = h ? statChips(h) : "";
  document.getElementById("away_stats").innerHTML = a ? statChips(a) : "";
}
function statChips(t){ return `<div class="stat-line"><div class="stat-chip"><div class="num">${t.att}</div><div class="lbl">ATT</div></div><div class="stat-chip"><div class="num">${t.def}</div><div class="lbl">DEF</div></div></div>`; }

function analyze(){
  const h = findTeam(state.homeSel), a = findTeam(state.awaySel);
  if(!h || !a){ toast("Sélectionnez les deux équipes.", "err"); return; }
  if(h.name === a.name && h.league===a.league){ toast("Choisissez deux équipes différentes.", "err"); return; }

  const homeAdv = 5;
  const homeScore = (h.att - a.def) + homeAdv;
  const awayScore = (a.att - h.def);
  const drawFactor = 12 - Math.min(10, Math.abs(homeScore-awayScore)/4);
  const expHome = Math.exp(homeScore/12), expAway = Math.exp(awayScore/12), expDraw = Math.exp(drawFactor/12)*0.9;
  const total = expHome+expAway+expDraw;
  const pHome = Math.round(expHome/total*100), pAway = Math.round(expAway/total*100), pDraw = Math.max(0,100-pHome-pAway);

  const homeGoals = Math.max(0.4, 1.35 + (h.att-a.def)/28);
  const awayGoals = Math.max(0.3, 1.05 + (a.att-h.def)/28);
  const totalGoals = homeGoals+awayGoals;
  const over25 = Math.min(92, Math.max(15, Math.round((totalGoals-1.2)*38)));
  const btts = Math.min(90, Math.max(20, Math.round(Math.min(homeGoals,awayGoals)*48)));

  const maxP = Math.max(pHome,pDraw,pAway);
  let mainPred = maxP===pHome ? "Victoire "+h.name : maxP===pAway ? "Victoire "+a.name : "Match nul";
  const confidence = maxP >= 55 ? "Élevé" : maxP >= 40 ? "Moyen" : "Faible";

  const result = { h, a, pHome, pDraw, pAway, mainPred, confidence, over25, btts, totalGoals: totalGoals.toFixed(2) };
  state.lastResult = result;
  showResult(result);
  saveHistory(result);
}
function showResult(r){
  const zone = document.getElementById("result_zone");
  if(!zone) return;
  zone.innerHTML = `
  <div class="result-hero" style="margin-top:6px;">
    <div class="small" style="letter-spacing:.5px;">PRÉDICTION PRINCIPALE</div>
    <div class="big">${escapeHtml(r.mainPred)}</div>
    <div class="small" style="margin-top:4px;">Niveau de confiance : ${r.confidence}</div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="row-between small"><span>Domicile ${r.pHome}%</span><span>Nul ${r.pDraw}%</span><span>Extérieur ${r.pAway}%</span></div>
    <div class="probbar"><span style="width:${r.pHome}%;background:var(--green);"></span><span style="width:${r.pDraw}%;background:var(--amber);"></span><span style="width:${r.pAway}%;background:var(--blue);"></span></div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="row-between"><span class="small">Tendance buts (total estimé)</span><b>${r.totalGoals}</b></div>
    <div class="divider"></div>
    <div class="row-between"><span class="small">Les deux équipes marquent</span><b>${r.btts}%</b></div>
    <div class="divider"></div>
    <div class="row-between"><span class="small">Plus de 2,5 buts</span><b>${r.over25}%</b></div>
    <div class="divider"></div>
    <p class="small">Statistiques utilisées : ${escapeHtml(r.h.name)} (ATT ${r.h.att} · DEF ${r.h.def}) vs ${escapeHtml(r.a.name)} (ATT ${r.a.att} · DEF ${r.a.def}).</p>
  </div>
  <p class="small" style="margin-top:10px;text-align:center;">Estimations statistiques à titre informatif — ne constituent pas un conseil de paris.</p>`;
}
async function saveHistory(r){
  try{ await api("history", "POST", { match: r.h.name+" vs "+r.a.name, prediction: r.mainPred, confidence: r.confidence, pHome:r.pHome, pDraw:r.pDraw, pAway:r.pAway }, session.token); }catch(e){}
}

        <li>Vous gardez le même frontend, seule la façon dont les données sont stockées change.</li>
      </ol>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="exportAllData()">📦 Exporter toutes les données (JSON)</button>
    </div>
  </div>
  <div id="adm_modal_root"></div>`;

  document.getElementById("na_duration").addEventListener("change", e=>{
    document.getElementById("na_custom_wrap").classList.toggle("hidden", e.target.value !== "custom");
  });

  loadAdminStatsAndTable();
  loadPendingRequests();
  loadTelegramContacts();
  loadAdminSettingsPanel();
}

async function loadAdminStatsAndTable(){
  try{ const data = await api("admin-list", "GET", null, adminToken); window.__accounts = data.accounts || []; }
  catch(e){ window.__accounts = []; }
  renderAdminStats();
  renderAdminTable();
}
function renderAdminStats(){
  const accs = window.__accounts || [];
  const now = Date.now();
  const active = accs.filter(a=>a.status==="actif" && (!a.expiresAt || a.expiresAt>now)).length;
  const expired = accs.filter(a=>a.status==="actif" && a.expiresAt && a.expiresAt<=now).length;
  const disabled = accs.filter(a=>a.status==="desactive").length;
  const el = document.getElementById("adm_stats");
  if(!el) return;
  el.innerHTML = `
    <div class="stat-box"><div class="n" style="color:var(--green);">${accs.length}</div><div class="l">Utilisateurs totaux</div></div>
    <div class="stat-box"><div class="n" style="color:var(--green);">${active}</div><div class="l">Codes actifs</div></div>
    <div class="stat-box"><div class="n" style="color:var(--amber);">${expired}</div><div class="l">Codes expirés</div></div>
    <div class="stat-box"><div class="n" style="color:var(--red);">${disabled}</div><div class="l">Codes désactivés</div></div>`;
}
function setAdminFilter(f){ state.adminFilter = f; renderAdminTable(); }
function onAdminSearch(){ state.adminSearch = document.getElementById("adm_search").value.toLowerCase(); renderAdminTable(); }
function accountRealStatus(a){
  if(a.status === "desactive") return "desactive";
  if(a.expiresAt && a.expiresAt < Date.now()) return "expire";
  return "actif";
}
function renderAdminTable(){
  const el = document.getElementById("adm_table");
  if(!el) return;
  let accs = window.__accounts || [];
  if(state.adminFilter !== "all") accs = accs.filter(a=> accountRealStatus(a) === state.adminFilter);
  if(state.adminSearch){
    accs = accs.filter(a => (a.pseudo||"").toLowerCase().includes(state.adminSearch) || (a.bookmakerId||"").toLowerCase().includes(state.adminSearch) || accountRealStatus(a).includes(state.adminSearch));
  }
  if(accs.length===0){ el.innerHTML = `<p class="muted small" style="padding:14px;">Aucun utilisateur.</p>`; return; }
  el.innerHTML = `<table class="admin-table"><thead><tr><th>Nom</th><th>Identifiant</th><th>Inscription</th><th>Expiration</th><th>Statut</th><th>Actions</th></tr></thead><tbody>
  ${accs.map(a=>{
    const st = accountRealStatus(a);
    const pillClass = st==="actif"?"pill-active":st==="expire"?"pill-expired":"pill-disabled";
    const pillLabel = st==="actif"?"Actif":st==="expire"?"Expiré":"Désactivé";
    return `<tr>
      <td>${escapeHtml(a.pseudo||"—")}</td>
      <td>${escapeHtml(a.bookmakerId||"—")}</td>
      <td>${fmtDate(a.registeredAt)}</td>
      <td>${fmtDate(a.expiresAt)}</td>
      <td><span class="pill ${pillClass}">${pillLabel}</span></td>
      <td>
        <button class="btn-sm btn-outline" onclick="viewAccount('${a.id}')">Voir</button>
        ${st==="desactive" ? `<button class="btn-sm btn-outline" onclick="accountAction('${a.id}','enable')">Réactiver</button>` : `<button class="btn-sm btn-outline" onclick="accountAction('${a.id}','disable')">Désactiver</button>`}
        <button class="btn-sm btn-danger" onclick="deleteAccount('${a.id}')">Supprimer</button>
      </td>
    </tr>`;
  }).join("")}
  </tbody></table>`;
}
function findAccount(id){ return (window.__accounts||[]).find(a=>a.id===id); }
function viewAccount(id){
  const a = findAccount(id); if(!a) return;
  const root = document.getElementById("adm_modal_root");
  root.innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet">
      <h3 style="margin-bottom:14px;">${escapeHtml(a.pseudo||"—")}</h3>
      <div class="stack small">
        <div class="row-between"><span>Identifiant</span><b>${escapeHtml(a.bookmakerId||"—")}</b></div>
        <div class="row-between"><span>Créé le</span><b>${fmtDate(a.registeredAt)}</b></div>
        <div class="row-between"><span>Expire le</span><b>${fmtDate(a.expiresAt)}</b></div>
        <div class="row-between"><span>Statut</span><b>${escapeHtml(accountRealStatus(a))}</b></div>
        <div class="row-between"><span>Dernière connexion</span><b>${fmtDate(a.lastLogin)}</b></div>
      </div>
      <div class="divider"></div>
      <div class="field"><label>Renouveler l'accès (jours)</label><input id="rn_days" type="number" min="1" value="7"></div>
      <button class="btn btn-primary" onclick="renewAccount('${a.id}')">Renouveler l'accès</button>
      <button class="btn btn-outline" style="margin-top:10px;" onclick="regenCode('${a.id}')">Générer un nouveau code</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="closeModal()">Fermer</button>
    </div>
  </div>`;
}
function closeModal(){ document.getElementById("adm_modal_root").innerHTML = ""; }
async function accountAction(id, action, extra){
  try{ await api("admin-account", "POST", Object.assign({ id, action }, extra||{}), adminToken); loadAdminStatsAndTable(); }
  catch(e){ toast("Erreur lors de l'opération.", "err"); }
}
async function deleteAccount(id){
  if(!confirm("Supprimer définitivement ce compte ? Cette action est irréversible.")) return;
  await accountAction(id, "delete");
  toast("Compte supprimé.", "ok");
}
async function renewAccount(id){
  const days = parseInt(document.getElementById("rn_days").value,10) || 7;
  try{ await api("admin-account", "POST", { id, action:"renew", days }, adminToken); toast("Accès renouvelé.", "ok"); closeModal(); loadAdminStatsAndTable(); }
  catch(e){ toast("Erreur lors du renouvellement.", "err"); }
}
async function regenCode(id){
  if(!confirm("Générer un nouveau code d'accès pour cet utilisateur ? L'ancien code ne fonctionnera plus.")) return;
  try{ const data = await api("admin-account", "POST", { id, action:"regen" }, adminToken); toast("Nouveau code : " + data.code, "ok"); closeModal(); loadAdminStatsAndTable(); }
  catch(e){ toast("Erreur lors de la génération.", "err"); }
}
async function loadPendingRequests(){
  const el = document.getElementById("adm_pending");
  try{
    const data = await api("pending", "GET", null, adminToken);
    const rows = data.requests || [];
    if(rows.length===0){ el.innerHTML = `<p class="muted small">Aucune demande en attente.</p>`; return; }
    el.innerHTML = rows.map(r=>`
      <div class="hist-item" style="margin-bottom:10px;">
        <div class="row-between"><b>${escapeHtml(r.pseudo)}</b><span class="small">${fmtDate(r.requestedAt)}</span></div>
        <div class="small">Identifiant : ${escapeHtml(r.bookmakerId)} ${r.phone? " · "+escapeHtml(r.phone):""} ${r.telegramUsername? " · @"+escapeHtml(r.telegramUsername):""}</div>
        <button class="btn-sm btn-primary" style="margin-top:8px;" onclick="prefillFromRequest('${r.id}','${escapeHtml(r.pseudo).replace(/'/g,"\\'")}','${escapeHtml(r.bookmakerId).replace(/'/g,"\\'")}')">Créer l'accès</button>
      </div>`).join("");
  }catch(e){ el.innerHTML = `<p class="muted small">Impossible de charger les demandes.</p>`; }
}
window.__pendingReqId = null;
function prefillFromRequest(reqId, pseudo, bkid){
  document.getElementById("na_pseudo").value = pseudo;
  document.getElementById("na_bkid").value = bkid;
  window.__pendingReqId = reqId;
  document.getElementById("na_pseudo").scrollIntoView({behavior:"smooth"});
}
async function createAccess(){
  const pseudo = document.getElementById("na_pseudo").value.trim();
  const bookmakerId = document.getElementById("na_bkid").value.trim();
  const durSel = document.getElementById("na_duration").value;
  const days = durSel === "custom" ? (parseInt(document.getElementById("na_custom").value,10)||1) : parseInt(durSel,10);
  const telegramChatId = document.getElementById("na_tgchat").value.trim();
  if(!pseudo || !bookmakerId){ toast("Nom et identifiant requis.", "err"); return; }
  try{
    const data = await api("admin-create-access", "POST", { pseudo, bookmakerId, days, telegramChatId, requestId: window.__pendingReqId }, adminToken);
    window.__pendingReqId = null;
    document.getElementById("na_result").innerHTML = `
      <div class="divider"></div>
      <p class="small">UTILISATEUR : <b>${escapeHtml(pseudo)}</b></p>
      <p class="small">IDENTIFIANT : <b>${escapeHtml(bookmakerId)}</b></p>
      <p class="small">DATE D'EXPIRATION : <b>${fmtDate(data.account.expiresAt)}</b></p>
      <p class="small">STATUT : <b>Actif</b></p>
      <div class="copy-code" style="margin-top:10px;">${data.code}</div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="copyCode('${data.code}')">Copier le code</button>
      ${data.telegramSent ? `<p class="small" style="margin-top:8px;color:var(--green);">✅ Code envoyé sur Telegram.</p>` : (telegramChatId ? `<p class="small" style="margin-top:8px;color:var(--amber);">⚠️ Envoi Telegram échoué — copiez le code manuellement.</p>` : ``)}`;
    document.getElementById("na_pseudo").value=""; document.getElementById("na_bkid").value=""; document.getElementById("na_tgchat").value="";
    toast("Code d'accès généré.", "ok");
    loadAdminStatsAndTable(); loadPendingRequests();
  }catch(e){ toast("Erreur lors de la génération de l'accès.", "err"); }
}
async function loadTelegramContacts(){
  const el = document.getElementById("tg_contacts");
  if(!el) return;
  el.innerHTML = `<div class="loader" style="margin:10px auto;"></div>`;
  try{
    const data = await api("telegram-contacts", "GET", null, adminToken);
    const rows = data.contacts || [];
    if(rows.length===0){ el.innerHTML = `<p class="muted small">Aucun message reçu par le bot pour l'instant. Demandez au client d'envoyer /start au bot.</p>`; return; }
    el.innerHTML = rows.map(c=>`
      <div class="hist-item" style="margin-bottom:8px;">
        <div class="row-between"><b>${c.username? "@"+escapeHtml(c.username) : escapeHtml(c.firstName||"Sans nom")}</b><span class="small">${fmtDate(c.date)}</span></div>
        <div class="row-between" style="margin-top:6px;"><span class="small">Chat ID : ${c.chatId}</span><button class="btn-sm btn-outline" onclick="useTelegramChatId('${c.chatId}')">Utiliser</button></div>
      </div>`).join("");
  }catch(e){ el.innerHTML = `<p class="muted small">Impossible de charger les contacts Telegram.</p>`; }
}
function useTelegramChatId(chatId){
  document.getElementById("na_tgchat").value = chatId;
  document.getElementById("na_tgchat").scrollIntoView({behavior:"smooth"});
  toast("Chat ID renseigné dans le formulaire.", "ok");
}
async function loadAdminSettingsPanel(){
  try{
    const data = await api("admin-settings", "GET", null, adminToken);
    if(document.getElementById("tg_admin_chat")) document.getElementById("tg_admin_chat").value = data.telegramAdminChatId || "";
    if(document.getElementById("tg_bot_username")) document.getElementById("tg_bot_username").value = data.telegramBotUsername || "";
  }catch(e){}
}
async function saveTelegramAdminSettings(){
  const telegramAdminChatId = document.getElementById("tg_admin_chat").value.trim();
  const telegramBotUsername = document.getElementById("tg_bot_username").value.trim();
  try{
    await api("public-settings", "POST", { telegramAdminChatId, telegramBotUsername }, adminToken);
    toast("Réglages Telegram admin mis à jour.", "ok");
  }catch(e){ toast("Erreur lors de la mise à jour.", "err"); }
}
async function exportAllData(){
  try{
    const data = await api("admin-export", "GET", null, adminToken);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "fifa-predict-pro-export-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("Export généré.", "ok");
  }catch(e){ toast("Erreur lors de l'export.", "err"); }
}
function copyCode(code){ navigator.clipboard && navigator.clipboard.writeText(code).then(()=>toast("Code copié.", "ok")).catch(()=>toast("Copie impossible.", "err")); }
async function changeAdminPassword(){
  const oldPassword = document.getElementById("sp_old").value;
  const newPassword = document.getElementById("sp_new").value;
  const confirmP = document.getElementById("sp_confirm").value;
  if(!oldPassword || !newPassword || !confirmP){ toast("Tous les champs sont requis.", "err"); return; }
  if(newPassword !== confirmP){ toast("Les nouveaux mots de passe ne correspondent pas.", "err"); return; }
  try{
    await api("admin-password", "POST", { oldPassword, newPassword }, adminToken);
    toast("Mot de passe administrateur mis à jour.", "ok");
    document.getElementById("sp_old").value=""; document.getElementById("sp_new").value=""; document.getElementById("sp_confirm").value="";
  }catch(e){ toast("Erreur : ancien mot de passe incorrect ou nouveau mot de passe trop court (6 caractères min).", "err"); }
}
async function saveTelegramContact(){
  const val = document.getElementById("tg_contact").value.trim();
  if(!val){ toast("Contact requis.", "err"); return; }
  try{ await api("public-settings", "POST", { telegramContact: val }, adminToken); telegramContact = val; toast("Contact Telegram mis à jour.", "ok"); }
  catch(e){ toast("Erreur lors de la mise à jour.", "err"); }
}

init();
</script>
</body>
</html>
